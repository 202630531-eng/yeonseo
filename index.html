<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 학습 & 심리 케어 센터 - MindStudy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 30px;
        }

        header h1 {
            color: #2c3e50;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        header p {
            color: #7f8c8d;
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 30px;
            text-align: center;
        }

        .btn-main {
            background-color: #4A90E2;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .btn-main:hover {
            background-color: #357ABD;
            transform: translateY(-2px);
        }

        /* 상담 영역 (처음에는 숨김) */
        .counseling-section {
            display: none;
            margin-top: 25px;
            text-align: left;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #34495e;
        }

        select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            outline: none;
        }

        select:focus, textarea:focus {
            border-color: #4A90E2;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .btn-submit {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #27ae60;
        }

        /* AI 답변 박스 */
        .ai-response {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #eef9f5;
            border-left: 5px solid #2ecc71;
            border-radius: 8px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌿 마음 편한 학습 코칭 센터</h1>
        <p>숙제 양에 대한 압박감, 공부 고민을 AI 멘토와 함께 풀어보세요.</p>
    </header>

    <div class="container">
        <!-- 메인 상담 시작 버튼 -->
        <button class="btn-main" id="startBtn" onclick="showForm()">🌱 공부에 대한 상담과 조언 받기</button>

        <!-- 상담 입력 폼 -->
        <div class="counseling-section" id="counselingSection">
            <label for="subject">1. 어떤 과목이 고민이신가요?</label>
            <select id="subject">
                <option value="국어">국어 (독해, 논술, 암기 등)</option>
                <option value="수학">수학 (문제풀이, 개념이해 등)</option>
                <option value="영어">영어 (단어, 문법, 독해 등)</option>
                <option value="과학/사회">탐구 (과학/사회/역사 등)</option>
                <option value="전반적인 숙제양">특정 과목 외 전체적인 숙제/공부량</option>
            </select>

            <label for="userMessage">2. 어떤 점이 가장 힘들거나 부담스러운가요?</label>
            <textarea id="userMessage" placeholder="예: 숙제 양이 너무 많아서 어디서부터 손대야 할지 모르겠고 불안해요."></textarea>

            <button class="btn-submit" onclick="getAICounsel()">AI 멘토에게 조언 구하기</button>
        </div>

        <!-- 로딩 표시 -->
        <div class="loading" id="loading">
            AI 멘토가 따뜻한 조언과 공부 방법을 작성하고 있습니다... 💭
        </div>

        <!-- AI 응답 결과 -->
        <div class="ai-response" id="aiResponse"></div>
    </div>

    <script>
        // 상담 입력 창 열기
        function showForm() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('counselingSection').style.display = 'block';
        }

        // AI 상담 요청 함수
        async function getAICounsel() {
            const subject = document.getElementById('subject').value;
            const userMessage = document.getElementById('userMessage').value;
            const responseBox = document.getElementById('aiResponse');
            const loadingBox = document.getElementById('loading');

            if (!userMessage.trim()) {
                alert('고민되는 내용을 간단히 적어주세요!');
                return;
            }

            // 로딩 표시 시작
            loadingBox.style.display = 'block';
            responseBox.style.display = 'none';

            // OpenAI API Key 설정 (실제 사용 시 본인의 API 키를 입력하세요)
            const apiKey = 'YOUR_OPENAI_API_KEY';

            // AI 프롬프트 (페르소나 부여: 따뜻한 멘토 + 효율적 공부법 제시)
            const prompt = `
            너는 학생들의 공부 압박감을 덜어주고 효율적인 공부법을 제시해 주는 따뜻하고 친절한 심리 상담가이자 학습 멘토야.
            
            [학생의 고민 정보]
            - 고민 과목/영역: ${subject}
            - 세부 고민: ${userMessage}

            [답변 작성 가이드]
            1. 공감과 위로: 학생이 느끼는 압박감에 깊이 공감하고 심리적 안정을 주는 따뜻한 한마디로 시작할 것.
            2. 현실적인 공부/숙제 접근법: ${subject} 과목의 부담을 줄이기 위한 단계별(Small Steps) 구체적인 전략 2~3가지를 추천할 것. (예: 15분 공부법, 우선순위 정하기 등)
            3. 응원의 메시지: 부담감을 내려놓고 편안한 마음을 가질 수 있도록 따뜻하게 마무리할 것.
            `;

            try {
                // API Key가 없는 경우를 위한 가상 응답 (테스트용)
                if (apiKey === 'YOUR_OPENAI_API_KEY') {
                    setTimeout(() => {
                        loadingBox.style.display = 'none';
                        responseBox.style.display = 'block';
                        responseBox.innerHTML = `<strong>[AI 멘토의 따뜻한 조언]</strong>\n\n` +
                            `많이 부담스럽고 힘들었겠어요. ${subject} 공부나 숙제가 끝이 없어 보일 때는 누구나 압박감을 느낀답니다. 그 마음은 아주 자연스러운 거예요.\n\n` +
                            `💡 **부담을 줄이는 작은 실천 팁:**\n` +
                            `1. **15분 타이머 기법**: '다 끝내야지' 생각하지 말고, 딱 15분만 집중해서 해보세요.\n` +
                            `2. **쪼개서 생각하기**: 거대한 숙제도 작게 나누면 쉬워집니다. 오늘 할 수 있는 최소한만 목표로 세워보세요.\n\n` +
                            `잘하고 싶어서 느끼는 부담감일 뿐이에요. 완벽하지 않아도 괜찮으니, 스스로를 너무 채찍질하지 마세요! 힘내요! 🌱\n\n` +
                            `*(※ 실제 AI 응답을 받으려면 HTML 코드 내에 OpenAI API Key를 넣어주세요)*`;
                    }, 1500);
                    return;
                }

                // 실제 OpenAI API 호출
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',
                        messages: [{ role: 'user', content: prompt }],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                loadingBox.style.display = 'none';

                if (data.choices && data.choices.length > 0) {
                    responseBox.style.display = 'block';
                    responseBox.innerHTML = `<strong>[AI 멘토의 따뜻한 조언]</strong>\n\n` + data.choices[0].message.content;
                } else {
                    alert('AI 답변을 가져오는데 실패했습니다. 키 설정을 확인해주세요.');
                }
            } catch (error) {
                console.error(error);
                loadingBox.style.display = 'none';
                alert('통신 중 오류가 발생했습니다.');
            }
        }
    </script>
</body>
</html>
